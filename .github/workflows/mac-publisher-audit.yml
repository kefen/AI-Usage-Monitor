name: Audit official Mac publisher
on:
  push:
    branches: ['candidate/release-*']
    paths: ['.github/workflows/mac-publisher-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Verify publisher and test local debugging without an account
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 2 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o official.dmg
          mkdir official-mount
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/official-mount" official.dmg
          for app in "$PWD/official-mount/"*.app; do
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1
          spctl --assess --type execute --verbose=4 "$app" 2>&1
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/"* "$app/Contents/Resources/codex"
          find "$app/Contents/Resources" -name codex -type f -print
          "$app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex" --version
          ditto "$app" /Applications/CQS-Official-Client-Test.app
          open -a /Applications/CQS-Official-Client-Test.app --args --remote-debugging-address=127.0.0.1 --remote-debugging-port=19299
          connected=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:19299/json/version > debug-version.json; then connected=true; break; fi
            sleep 1
          done
          if [[ "$connected" != true ]]; then echo 'No local debug endpoint'; exit 1; fi
          cat debug-version.json
          lsof -nP -iTCP:19299 -sTCP:LISTEN
          done
          shasum -a 256 official.dmg
          hdiutil detach "$PWD/official-mount"
