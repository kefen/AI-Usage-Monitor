name: Audit official Mac publisher
on:
  push:
    branches: ['candidate/release-*']
    paths: ['.github/workflows/mac-publisher-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - name: Verify publisher and test local debugging without an account
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 2 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o official.dmg
          mkdir official-mount
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/official-mount" official.dmg
          for app in "$PWD/official-mount/"*.app; do
          codesign --verify --deep --strict -R '=anchor apple generic and identifier "com.openai.codex" and certificate leaf[subject.OU] = "2DC432GLL2"' "$app"
          codesign -dv --verbose=4 "$app" 2>&1
          spctl --assess --type execute --verbose=4 "$app" 2>&1
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/"* "$app/Contents/Resources/codex"
          find "$app/Contents/Resources" -name codex -type f -print
          "$app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex" --version
          ditto "$app" /Applications/Codex.app
          open -a /Applications/Codex.app --args --remote-debugging-address=127.0.0.1 --remote-debugging-port=19299
          connected=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:19299/json/version > debug-version.json; then connected=true; break; fi
            sleep 1
          done
          if [[ "$connected" != true ]]; then echo 'No local debug endpoint'; exit 1; fi
          cat debug-version.json
          lsof -nP -iTCP:19299 -sTCP:LISTEN
          node mac/launch.mjs --native-ui --focus
          echo 'PASS: actual launcher signature rule and official client activation without an account'
          osascript -e 'tell application "/Applications/Codex.app" to quit'
          sleep 3
          open -a /Applications/Codex.app
          sleep 5
          node -e 'const r=require("node:child_process").spawnSync(process.execPath,["mac/launch.mjs","--native-ui"],{timeout:75000,stdio:"inherit"});if(r.status!==1)process.exit(1)'
          grep -qx E_RESTART_REQUIRED .runtime/mac-error.txt
          node mac/launch.mjs --native-ui --restart-approved > restart-test.log 2>&1 &
          monitor=$!
          ready=false
          for attempt in $(seq 1 120); do
            if [[ -f .runtime/status.json ]] && node -e 'const s=require("./.runtime/status.json");process.exit((String(s.stage).startsWith("mounted")||s.stage==="sidebar-missing")?0:1)'; then ready=true; break; fi
            if ! kill -0 "$monitor" 2>/dev/null; then break; fi
            sleep 1
          done
          printf stop > .runtime/background-stop.request
          if [[ "$ready" != true ]]; then cat restart-test.log; cat .runtime/mac-error.txt || true; kill "$monitor" 2>/dev/null || true; wait "$monitor" || true; exit 1; fi
          for attempt in $(seq 1 45); do if ! kill -0 "$monitor" 2>/dev/null; then break; fi; sleep 1; done
          if kill -0 "$monitor" 2>/dev/null; then kill "$monitor"; wait "$monitor" || true; echo 'Monitor stop timeout'; exit 1; fi
          wait "$monitor"
          echo 'PASS: ordinary running official client requires approval; approved graceful restart establishes a verified local session without an account'
          done
          shasum -a 256 official.dmg
          hdiutil detach "$PWD/official-mount"
