name: AI Usage Monitor release
on:
  push:
    branches: [main, candidate/ai-usage-monitor-release]
    paths: ['.github/workflows/board-release.yml', 'versions.json', 'browser-web/manifest.json']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [windows, macos, chrome, all]
        default: windows
        description: Platform to build
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      chrome: ${{ steps.plan.outputs.chrome }}
      win_version: ${{ steps.plan.outputs.win_version }}
      mac_version: ${{ steps.plan.outputs.mac_version }}
      web_version: ${{ steps.plan.outputs.web_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          base=${BEFORE:-HEAD^}
          if [[ "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          for platform in windows macos chrome; do
            file=versions.json; key=$platform
            case "$platform" in
              windows) out=win_version ;;
              macos) out=mac_version ;;
              chrome) file=browser-web/manifest.json; key=version; out=web_version ;;
            esac
            version=$(jq -er --arg k "$key" '.[$k]' "$file")
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]
            echo "$out=$version" >> "$GITHUB_OUTPUT"
            changed=false
            if [[ -n "$PLATFORM" ]]; then
              if [[ "$PLATFORM" == "$platform" || "$PLATFORM" == all ]]; then changed=true; fi
            else
              old=$(git show "$base:$file" | jq -er --arg k "$key" '.[$k]')
              if [[ "$old" != "$version" ]]; then changed=true; fi
            fi
            echo "$platform=$changed" >> "$GITHUB_OUTPUT"
          done
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - shell: pwsh
        run: |
          ./Build-Windows.ps1
          ./test/install.test.ps1
          ./test/rollback.test.ps1
          ./test/restart.test.ps1
          ./test/lifecycle.test.ps1
          ./runtime/node.exe test/package-extract.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-windows
          path: |
            dist/AI-Usage-Monitor-*Setup.exe
            dist/AI-Usage-Monitor-source-*.zip
          if-no-files-found: error
  mac:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - run: bash mac/Build.command ${{ matrix.arch }}
      - run: node test/mac-update-integration.mjs
      - name: Check packaged Mac application name
        run: test -d "$(find build -type d -path '*/image/AI Usage Monitor.app' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-screens-${{ matrix.arch }}
          path: verification/mac-${{ matrix.arch }}/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-mac-${{ matrix.arch }}
          path: dist/AI-Usage-Monitor-*unsigned-test.dmg
          if-no-files-found: error
  chrome:
    needs: plan
    if: needs.plan.outputs.chrome == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - run: node --test browser-web/test/*.test.mjs
      - shell: pwsh
        run: ./browser-web/Build-Test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-chrome
          path: dist/chrome-web-${{ needs.plan.outputs.web_version }}/AI-Usage-Monitor-Chrome-${{ needs.plan.outputs.web_version }}.zip
          if-no-files-found: error
  publish:
    needs: [plan, windows, mac, chrome]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (needs.windows.result == 'success' || needs.mac.result == 'success' || needs.chrome.result == 'success') && github.repository == 'kefen/AI-Usage-Monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'board-*', path: dist, merge-multiple: true}
      - working-directory: dist
        env:
          WIN: ${{ needs.plan.outputs.win_version }}
          MAC: ${{ needs.plan.outputs.mac_version }}
          WEB: ${{ needs.plan.outputs.web_version }}
          BUILD_WIN: ${{ needs.plan.outputs.windows }}
          BUILD_MAC: ${{ needs.plan.outputs.macos }}
          BUILD_WEB: ${{ needs.plan.outputs.chrome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          publish() {
            local tag="$1" title="$2" flag="$3" notes="$4"; shift 4
            local sums="SHA256SUMS-${tag%/*}.txt"
            sha256sum "$@" > "$sums"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$@" "$sums" --target "$GITHUB_SHA" --title "AI Usage Monitor · $title" --notes "$notes" --draft
            fi
            local check
            check=$(mktemp -d)
            gh release download "$tag" --dir "$check"
            for f in "$@" "$sums"; do cmp "$f" "$check/$f"; done
            gh release edit "$tag" --draft=false "$flag"
          }
          if [[ "$BUILD_MAC" == true ]]; then
            publish "macos/v$MAC" "macOS $MAC" '--prerelease' '更新签名已更换。旧版请退出应用，从本页按芯片下载 DMG，将 AI Usage Monitor 拖入应用程序。无需清理设置。未公证预发布版。' AI-Usage-Monitor-macOS-"$MAC"-{arm64,x86_64}-unsigned-test.dmg
          fi
          if [[ "$BUILD_WEB" == true ]]; then
            publish "chrome/v$WEB" "Chrome $WEB" '--latest=false' '解压 ZIP 后在 Chrome 扩展管理页加载。非商店版。' "AI-Usage-Monitor-Chrome-$WEB.zip"
          fi
          if [[ "$BUILD_WIN" == true ]]; then
            publish "windows/v$WIN" "Windows $WIN" '--latest' '更新签名已更换。旧版请从本页下载 Setup.exe 安装一次，选择原安装目录。Windows 10/11 x64；安装程序未做 Authenticode 签名。' "AI-Usage-Monitor-Windows-$WIN-x64-Setup.exe" "AI-Usage-Monitor-source-windows-$WIN-macos-$MAC.zip"
          fi
