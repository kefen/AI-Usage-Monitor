name: AI Quota Board release
on:
  push:
    branches: [main, candidate/ai-quota-board-release]
    paths: ['.github/workflows/board-release.yml', 'versions.json', 'browser-web/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - shell: pwsh
        run: |
          ./Build-Windows.ps1
          ./test/install.test.ps1
          ./test/rollback.test.ps1
          ./test/restart.test.ps1
          ./test/lifecycle.test.ps1
          ./runtime/node.exe test/package-extract.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-windows
          path: |
            dist/AI-Quota-Board-*Setup.exe
            dist/AI-Quota-Board-source-*.zip
          if-no-files-found: error
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - run: bash mac/Build.command ${{ matrix.arch }}
      - run: node test/mac-update-integration.mjs
      - name: Check packaged Mac application name
        run: test -d "$(find build -type d -path '*/image/AI Quota Board.app' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-screens-${{ matrix.arch }}
          path: verification/mac-${{ matrix.arch }}/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-mac-${{ matrix.arch }}
          path: dist/AI-Quota-Board-*unsigned-test.dmg
          if-no-files-found: error
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - run: node --test browser-web/test/*.test.mjs
      - shell: pwsh
        run: ./browser-web/Build-Test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-chrome
          path: dist/chrome-web-0.5.4/AI-Quota-Board-Chrome-0.5.4.zip
          if-no-files-found: error
  publish:
    needs: [windows, mac, chrome]
    if: github.repository == 'kefen/AI-Quota-Board' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'board-*', path: dist, merge-multiple: true}
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          publish() {
            local tag="$1" title="$2" flag="$3" notes="$4"; shift 4
            local sums="SHA256SUMS-${tag%/*}.txt"
            sha256sum "$@" > "$sums"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$@" "$sums" --target "$GITHUB_SHA" --title "AI Quota Board · $title" --notes "$notes" --draft
            fi
            local check
            check=$(mktemp -d)
            gh release download "$tag" --dir "$check"
            for f in "$@" "$sums"; do cmp "$f" "$check/$f"; done
            gh release edit "$tag" --draft=false "$flag"
          }
          publish 'macos/v0.5.4-alpha.4' 'macOS 0.5.4-alpha.4' '--prerelease' 'Apple Silicon: arm64; Intel: x86_64. 未公证的 Mac 预发布版。退出旧版后将 AI Quota Board.app 拖入应用程序。首次更名升级请手动安装；不删除设置目录。' AI-Quota-Board-macOS-0.5.4-alpha.4-{arm64,x86_64}-unsigned-test.dmg
          publish 'chrome/v0.5.4' 'Chrome 0.5.4' '--latest=false' 'Standalone ChatGPT sidebar extension by KEFEN. 解压 ZIP 后在 Chrome 扩展管理页加载。非 Chrome 网上应用店发行版。' AI-Quota-Board-Chrome-0.5.4.zip
          publish 'windows/v0.13.6' 'Windows 0.13.6' '--latest' 'Windows 10/11 x64 · by KEFEN. 下载 Setup.exe，核对 SHA-256 后安装；升级请使用原安装目录以保留设置。安装包未签名。' AI-Quota-Board-Windows-0.13.6-x64-Setup.exe AI-Quota-Board-source-windows-0.13.6-macos-0.5.4-alpha.4.zip
