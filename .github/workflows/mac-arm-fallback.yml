name: Cross-build ARM Mac test candidate
on:
  push:
    branches: ['candidate/release-*']
    paths: ['.github/workflows/mac-arm-fallback.yml']
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      # 0.4.5 UI candidate: use the arm64 Swift target and the official arm64 Node binary.
      # Native ARM execution tests are deliberately not claimed on this Intel host.
      - run: bash mac/Build.command arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-arm64-cross-built-unsigned-test
          path: dist/*arm64-unsigned-test.dmg
          retention-days: 14
