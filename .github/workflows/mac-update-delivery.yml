name: Check live desktop update delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/updates/v2.json'
permissions: {contents: read}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - shell: pwsh
        run: |
          $target=(Get-Content versions.json -Raw | ConvertFrom-Json).windows
          $prior=git log --first-parent --format=%H -- versions.json | Where-Object { (git show "${_}:versions.json" | ConvertFrom-Json).windows -ne $target } | Select-Object -First 1
          if (!$prior) { throw 'No previous Windows version found' }
          $dir=Join-Path $env:RUNNER_TEMP previous-windows
          git worktree add --detach $dir $prior
          if ($LASTEXITCODE) { throw 'Previous checkout failed' }
          if ($target -eq '0.13.8') {
            ./tools/verify-windows-update-path.ps1 -PriorClient . -Version $target -InstalledVersions (Join-Path $dir versions.json)
          } else {
            ./tools/verify-windows-update-path.ps1 -PriorClient $dir -Version $target
          }
  previous-client:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.16.0'}
      - name: Check with the previous version's updater
        shell: bash
        run: |
          set -euo pipefail
          target=$(jq -er .macos versions.json)
          prior=''
          for rev in $(git log --first-parent --format=%H -- versions.json); do
            previous=$(git show "$rev:versions.json" | jq -er .macos)
            if [[ "$previous" != "$target" ]]; then prior=$rev; break; fi
          done
          test -n "$prior"
          git worktree add --detach "$RUNNER_TEMP/previous-client" "$prior"
          if [[ "$target" == '0.5.4-alpha.5' ]]; then
            # Bootstrap is a manual install. Exercise its new key using a lower version fixture.
            node tools/verify-mac-update-path.mjs . "$target" "${{ matrix.arch }}" "$RUNNER_TEMP/previous-client/versions.json"
          else
            node tools/verify-mac-update-path.mjs "$RUNNER_TEMP/previous-client" "$target" "${{ matrix.arch }}"
          fi
