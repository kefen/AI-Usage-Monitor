name: R2 unsigned Mac test packages
on:
  push:
    branches: ['candidate/r2-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: bash mac/Build.command ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ matrix.arch }}-unsigned-test
          path: dist/*unsigned-test.dmg
          retention-days: 14
