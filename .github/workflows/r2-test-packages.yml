name: R2 unsigned Mac test packages
on:
  push:
    branches: ['candidate/r2-*', 'candidate/release-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: bash mac/Build.command ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ matrix.arch }}-unsigned-test
          path: |
            dist/*unsigned-test.dmg
            verification/mac-*/**/*.png
          retention-days: 14
