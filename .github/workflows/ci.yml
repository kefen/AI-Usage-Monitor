name: Candidate Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    strategy:
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: node --test test/*.test.mjs
      - run: node --check mac/launch.mjs
      - run: python3 build_release.py --source-only
        if: runner.os == 'macOS'
      - name: Build Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Test Windows install and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./test/install.test.ps1
          ./test/rollback.test.ps1
          ./test/restart.test.ps1
          ./test/lifecycle.test.ps1
          node test/package-extract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
