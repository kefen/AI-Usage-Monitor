<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Usage Monitor</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header class="browser-header"><img src="icon-32.png" alt=""><div><div class="browser-brand">AI Usage Monitor</div><div class="byline">by KEFEN</div></div></header>
<div class="browser-actions"><button id="check-updates" data-i18n="Check for updates">Check for updates</button><label class="language-control" title="Language"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6m-7 0 6-6 2-3M2 5h12M7 2h1m14 20-5-10-5 10m2-4h6"/></svg><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option></select></label></div>
<p id="update-status" role="status" hidden></p>
<main class="browser-content" id="overview"><div class="page-top"><h1 data-i18n="Usage overview">Usage overview</h1><span id="status" role="status"></span></div><div id="metrics" class="overview-groups"></div><p class="source-line" data-i18n="Usage: local CLI account. Plan: desktop detection or manual record."></p><p id="selection" class="selection-mini"></p><p id="settings-feedback" role="status" hidden></p></main>
<footer class="browser-foot"><span id="version"></span><button id="display-settings" data-i18n="Display choices">Display choices</button></footer>
<details class="connection"><summary data-i18n="Connection details">Connection details</summary><p data-i18n="This extension reads local snapshots, not website cookies."></p><p data-i18n="Local CLI account; may differ from the desktop account."></p><p><span data-i18n="Extension ID"></span>: <code id="extension-id"></code></p><p id="stamp"></p><button id="refresh" data-i18n="Refresh data">Refresh data</button><button id="export" data-i18n="Export sanitized diagnostics">Export sanitized diagnostics</button><p id="help-feedback" role="status"></p><a href="https://github.com/kefen/AI-Usage-Monitor/issues/new" target="_blank" rel="noopener noreferrer" data-i18n="Submit feedback on GitHub"></a><p data-i18n="Unofficial software. Not affiliated with or endorsed by OpenAI."></p><a href="https://github.com/kefen/AI-Usage-Monitor" target="_blank" rel="noopener noreferrer">GitHub · MIT · by KEFEN</a></details>
<script src="strings.js"></script><script src="panel.js"></script>
</body></html>
