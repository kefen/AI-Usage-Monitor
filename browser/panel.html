<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Quota Sidebar</title><link rel="stylesheet" href="panel.css"></head>
<body><header><img src="icon-32.png" alt=""><div>Codex Quota Sidebar<small>by KEFEN <span id="version"></span></small></div></header>
<div class="toolbar"><label for="language" data-i18n="Language">Language</label><select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option></select></div>
<main><h1 data-i18n="Usage overview">Usage overview</h1><p id="status" role="status"></p><p id="notice" data-i18n="Local CLI account; may differ from the desktop account."></p>
<dl id="metrics"></dl><p id="stamp"></p><button id="refresh" data-i18n="Refresh data">Refresh data</button>
<details><summary data-i18n="Connection details">Connection details</summary><p data-i18n="This extension reads local snapshots, not website cookies."></p><p><span data-i18n="Extension ID"></span>: <code id="extension-id"></code></p></details>
</main><footer><a href="https://github.com/kefen/codex-quota-sidebar" target="_blank" rel="noopener noreferrer">GitHub</a><span data-i18n="Unofficial companion"></span></footer>
<script src="strings.js"></script><script src="panel.js"></script></body></html>
